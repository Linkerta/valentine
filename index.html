<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш архив</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>

<!-- ── ЭКРАН 1: сургучная печать ─────────────────────── -->
<div id="seal">
  <div class="wax">&#10084;</div>
  <p>нажмите, чтобы вскрыть</p>
</div>

<!-- ── ЭКРАН 2: телеграмма ───────────────────────────── -->
<section id="intro">
  <div class="blank" id="blank">
    <div class="head">
      <h1>Телеграмма</h1>
      <div class="meta">
        <span id="m-from">Откуда: &mdash;</span>
        <span>№ 14/02</span>
      </div>
    </div>
    <div class="rule">Кому <b id="m-to">&mdash;</b> &nbsp;·&nbsp; Срочная &nbsp;·&nbsp; Оплачено</div>
    <div id="tape"></div>
    <div class="stamp" id="stamp">Вручить лично</div>
    <div class="sign" id="sign"></div>
    <button class="open-album" id="open-album">Открыть приложение</button>
  </div>
</section>

<!-- ── ЭКРАН 3: альбом ───────────────────────────────── -->
<div id="shell" hidden>

  <button id="mode-toggle">Страницы</button>

  <!-- режим «лента» -->
  <main id="scroll-mode">
    <header class="album-head">
      <p class="eyebrow">Приложение к телеграмме № 14/02</p>
      <h2 class="album-title"></h2>
      <p class="album-sub"></p>
    </header>
    <div id="feed"></div>
    <footer class="album-foot">
      <div class="sign on foot-sign"></div>
      <p class="eyebrow foot-note"></p>
    </footer>
  </main>

  <!-- режим «книга» -->
  <div id="book-mode" hidden>
    <div id="book"></div>
    <div id="booknav">
      <button id="prev" aria-label="Назад">&lsaquo;</button>
      <span id="pageno"></span>
      <button id="next" aria-label="Вперёд">&rsaquo;</button>
    </div>
  </div>

</div>

<!-- ── просмотр фото ─────────────────────────────────── -->
<div id="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <button id="lightbox-close" aria-label="Закрыть">&times;</button>
</div>

<script src="assets/story.js?v=3"></script>
<script src="assets/app.js?v=3"></script>
</body>
</html>
