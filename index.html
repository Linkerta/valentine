<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Телеграмма</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  /* ── ТОКЕНЫ ───────────────────────────────────────── */
  :root{
    --paper:      #EFE3CC;   /* бланк */
    --paper-deep: #E2D2B4;   /* тень сгиба */
    --ink:        #2A2119;   /* машинописная лента */
    --ink-soft:   #6B5B47;   /* служебные пометки */
    --stamp:      #B03A2E;   /* штемпельная краска */
    --wire:       #2E5A88;   /* линии бланка */
    --dark:       #14100C;   /* фон стола */

    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --hand: 'Caveat', cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #221B14 0%, var(--dark) 70%);
    font-family:var(--mono);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:20px 14px calc(20px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ── БЛАНК ────────────────────────────────────────── */
  .blank{
    position:relative;
    width:100%; max-width:420px;
    background:var(--paper);
    padding:26px 22px 30px;
    box-shadow:0 24px 50px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.15) inset;
    /* перфорация по краям */
    -webkit-mask:
      radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left/100% 16px repeat-y,
      radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right/100% 16px repeat-y;
    -webkit-mask-composite:source-in;
    mask:
      radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left/100% 16px repeat-y,
      radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right/100% 16px repeat-y;
    mask-composite:intersect;
    transform-origin:top center;
  }
  /* волокна бумаги */
  .blank::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px),
      radial-gradient(80% 60% at 20% 10%, rgba(160,120,60,.13), transparent 60%);
    mix-blend-mode:multiply;
  }
  /* след сгиба */
  .blank::after{
    content:''; position:absolute; left:0; right:0; top:38%; height:14px;
    background:linear-gradient(180deg, transparent, rgba(90,60,20,.14), transparent);
    pointer-events:none;
  }

  /* ── ШАПКА ────────────────────────────────────────── */
  .head{border-bottom:2px solid var(--wire); padding-bottom:10px; margin-bottom:4px}
  .head h1{
    font-size:clamp(15px,5.2vw,19px); font-weight:800; letter-spacing:.34em;
    color:var(--wire); text-transform:uppercase;
  }
  .meta{
    display:flex; justify-content:space-between; gap:10px;
    font-size:9.5px; letter-spacing:.13em; color:var(--ink-soft);
    text-transform:uppercase; margin-top:7px;
  }
  .rule{
    border-top:1px solid rgba(46,90,136,.45);
    margin:14px 0 18px; font-size:9px; letter-spacing:.16em;
    color:var(--ink-soft); padding-top:6px; text-transform:uppercase;
  }

  /* ── ТЕЛЕТАЙП ─────────────────────────────────────── */
  #tape{
    min-height:190px;
    font-size:clamp(13px,4vw,15px); line-height:1.95;
    letter-spacing:.06em; text-transform:uppercase;
    white-space:pre-wrap; word-break:break-word;
  }
  #tape .em{color:var(--stamp); font-weight:700}
  .caret{
    display:inline-block; width:.62em; height:1.05em; vertical-align:-.18em;
    background:var(--ink); animation:blink .9s steps(1,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* ── ШТАМП ────────────────────────────────────────── */
  .stamp{
    position:absolute; right:16px; bottom:104px;
    padding:8px 13px; border:3px double var(--stamp); border-radius:3px;
    color:var(--stamp); font-size:11px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; transform:rotate(-11deg) scale(2.6); opacity:0;
    mix-blend-mode:multiply; pointer-events:none;
  }
  .stamp.hit{animation:thud .45s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes thud{
    0%{opacity:0; transform:rotate(-11deg) scale(2.6)}
    60%{opacity:.95; transform:rotate(-11deg) scale(.94)}
    100%{opacity:.88; transform:rotate(-11deg) scale(1)}
  }

  /* ── ПОДПИСЬ ──────────────────────────────────────── */
  .sign{
    margin-top:26px; text-align:right;
    font-family:var(--hand); font-size:34px; color:var(--wire);
    opacity:0; transform:translateY(8px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .sign.on{opacity:1; transform:none}

  /* ── ДЕЙСТВИЯ ─────────────────────────────────────── */
  .actions{
    display:flex; gap:10px; margin-top:24px;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .6s ease .2s, transform .6s ease .2s;
  }
  .actions.on{opacity:1; transform:none; pointer-events:auto}
  button{
    flex:1; font-family:var(--mono); font-size:11px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; padding:13px 8px;
    border-radius:2px; cursor:pointer; transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--wire); outline-offset:3px}
  .primary{background:var(--stamp); color:var(--paper); border:none}
  .ghost{background:transparent; color:var(--ink-soft); border:1px solid rgba(107,91,71,.5)}

  /* ── КОНВЕРТ (стартовый экран) ────────────────────── */
  #seal{
    position:fixed; inset:0; z-index:9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; background:var(--dark); cursor:pointer;
    transition:opacity .5s ease;
  }
  #seal.gone{opacity:0; pointer-events:none}
  .wax{
    width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #D4553F, var(--stamp) 55%, #7C241B);
    box-shadow:0 10px 26px rgba(0,0,0,.6), inset 0 -4px 10px rgba(0,0,0,.35);
    display:grid; place-items:center; color:#F3DDBE; font-size:30px;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  #seal p{
    font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
    color:#8A7A63;
  }
  .unfold{animation:unfold .9s cubic-bezier(.22,1,.36,1) both}
  @keyframes unfold{
    0%{transform:perspective(900px) rotateX(-88deg); opacity:0}
    100%{transform:perspective(900px) rotateX(0); opacity:1}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div id="seal">
  <div class="wax">&#10084;</div>
  <p>нажмите, чтобы вскрыть</p>
</div>

<main class="blank" id="blank" aria-live="polite">
  <div class="head">
    <h1>Телеграмма</h1>
    <div class="meta">
      <span id="m-from">Откуда: &mdash;</span>
      <span id="m-no">№ 14/02</span>
    </div>
  </div>
  <div class="rule">Кому <b id="m-to">&mdash;</b> &nbsp;·&nbsp; Срочная &nbsp;·&nbsp; Оплачено</div>

  <div id="tape"></div>

  <div class="stamp" id="stamp">Вручить лично</div>
  <div class="sign" id="sign"></div>

  <div class="actions" id="actions">
    <button class="primary" id="reply">Ответить</button>
    <button class="ghost" id="again">Ещё раз</button>
  </div>
</main>

<script>
/* ══ НАСТРОЙКИ — правьте только этот блок ══════════════ */
const CFG = {
  to:      'Аня',
  from:    'Игорь',
  sign:    'твой Игорь',
  me:      'igor',                 // твой @username без собаки — туда ведёт «Ответить»
  lines: [
    'Аня тчк',
    '',
    'Связь работает уже {N} лет зпт',
    'обрывов не зафиксировано тчк',
    '',
    'Сообщаю официально двоеточие',
    '<em>ты моя главная линия</em> тчк',
    '',
    'Ответа жду вечером тчк',
    'Ужин за мной тчк'
  ],
  years: 3,
  speed: 34                        // мс на символ
};
/* ══════════════════════════════════════════════════════ */

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#14100C'); tg.setBackgroundColor?.('#14100C'); }

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('m-to').textContent   = CFG.to;
$('m-from').textContent = 'Откуда: ' + CFG.from;
$('sign').textContent   = CFG.sign;

const text = CFG.lines.join('\n').replace('{N}', CFG.years);
const tape = $('tape');

function tick(){ tg?.HapticFeedback?.impactOccurred?.('light'); }

async function type(){
  tape.innerHTML = '';
  $('stamp').classList.remove('hit');
  $('sign').classList.remove('on');
  $('actions').classList.remove('on');

  if (reduce){ tape.innerHTML = text.replace(/<em>/g,'<span class="em">').replace(/<\/em>/g,'</span>'); finish(); return; }

  let out = '', i = 0;
  const caret = '<span class="caret"></span>';
  while (i < text.length){
    if (text.startsWith('<em>', i))      { out += '<span class="em">'; i += 4; continue; }
    if (text.startsWith('</em>', i))     { out += '</span>';           i += 5; continue; }
    out += text[i] === '\n' ? '\n' : text[i];
    if (text[i] !== ' ' && text[i] !== '\n' && i % 3 === 0) tick();
    i++;
    tape.innerHTML = out + caret;
    await sleep(text[i-1] === '\n' ? CFG.speed * 7 : CFG.speed + Math.random() * 22);
  }
  tape.innerHTML = out;
  finish();
}

function finish(){
  setTimeout(() => {
    $('stamp').classList.add('hit');
    tg?.HapticFeedback?.impactOccurred?.('heavy');
    setTimeout(() => $('sign').classList.add('on'), 400);
    setTimeout(() => $('actions').classList.add('on'), 800);
  }, reduce ? 0 : 500);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

$('seal').addEventListener('click', () => {
  $('seal').classList.add('gone');
  $('blank').classList.add('unfold');
  tg?.HapticFeedback?.impactOccurred?.('medium');
  setTimeout(type, reduce ? 0 : 700);
});

$('again').addEventListener('click', type);

$('reply').addEventListener('click', () => {
  tg?.HapticFeedback?.notificationOccurred?.('success');
  const chat = 'https://t.me/' + CFG.me;
  if (tg?.openTelegramLink) { tg.openTelegramLink(chat); tg.close(); }
  else { window.open(chat, '_blank'); }
});
</script>
</body>
</html>
